# Rate limiting zone: 90 requests per minute
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

upstream forum_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name 54.179.110.26;

    # Rate limiting untuk /threads dan sub-pathnya
    location /threads {
        limit_req zone=threads_limit burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://forum_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Route lainnya (tanpa rate limit)
    location / {
        proxy_pass http://forum_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}